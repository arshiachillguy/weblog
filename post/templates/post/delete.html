<!DOCTYPE html>
<html>
<head>
    <title>Delete Post</title>
</head>

<body>

    <h1>Delete Post</h1>

    <p>
        Are you sure you want to delete this post?
    </p>

    <h2>
        {{ post.title }}
    </h2>

    <p>
        {{ post.content }}
    </p>
    <p>Author :{{request.user.username}}</p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'post_details' post.id %}">
        Cancel
    </a>

</body>
</html>
