<!DOCTYPE html>
<html>
<body>

<h1>Create User</h1>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}


<form method="POST">
    {% csrf_token %}

    

    {{ form.username }}
    
    {{ form.email }}
    
    {{ form.password1 }}
    
    {{ form.password2 }}
    
    {{ form.errors }}

    <button type="submit">
        Create
    </button>

</form>

</body>
</html>
