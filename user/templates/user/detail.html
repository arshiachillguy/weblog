<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Detail</title>
</head>
<body>

    <h1>User Detail</h1>

    <p>
        <strong>ID:</strong> {{ user.id }}
    </p>

    <p>
        <strong>Username:</strong> {{ user.username }}
    </p>

    <p>
        <strong>Email:</strong> {{ user.email }}
    </p>


    <a href="{% url 'update_user' user.pk %}">
        Edit
    </a>

    <a href="{% url 'delete_user' user.pk %}">
        Delete
    </a>

</body>
</html>
