<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="color: green;">Welcome to weblogi ????</title>
    <style>
        .container {
            text-align: center;
            margin: 100px auto;

            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: green;

        }

        <!-- Page heading -->

    <div>

    <a href="{% url 'all_posts' %}">

    </a>

</div>
